name: "Frontend React"
description: "React/TypeScript frontend. Example skills + outreach templates — edit freely."
schema_version: 2

search:
  default_terms:
    - "frontend react developer"
    - "react engineer"
    - "typescript frontend"
    - "nextjs developer"
  title_keywords_positive:
    - "frontend"
    - "front-end"
    - "front end"
    - "react"
    - "typescript"
    - "javascript"
    - "ui engineer"
    - "software engineer"
    - "full stack"
    - "fullstack"
  title_keywords_negative:
    - "backend"
    - "back-end"
    - "devops"
    - "data scientist"
    - "machine learning"
    - "ios"
    - "android"
    - "qa"
    - "intern"
    - "internship"
  relevant_skills:
    - "react"
    - "typescript"
    - "javascript"
    - "nextjs"
    - "next.js"
    - "redux"
    - "tailwind"
    - "css"
    - "html"
    - "graphql"
    - "webpack"
    - "vite"
    - "jest"
    - "cypress"
    - "node"
  jsearch_default_queries:
    - { query: "frontend react developer", country: "us", date_posted: "3days", remote_jobs_only: false }
    - { query: "react engineer", country: "us", date_posted: "3days", remote_jobs_only: false }
    - { query: "typescript frontend", country: "us", date_posted: "week", remote_jobs_only: false }
    - { query: "nextjs developer", country: "us", date_posted: "week", remote_jobs_only: false }
    - { query: "frontend engineer remote", country: "us", date_posted: "week", remote_jobs_only: true }
    - { query: "react developer remote", country: "gb", date_posted: "week", remote_jobs_only: true }

scoring:
  experience_target: "mid"
  min_relevance_score: 50
  min_score_to_store: 25
  weights: { title: 35, skills: 35, experience: 15, signal: 15 }
  core_skills:
    - "react"
    - "typescript"
    - "javascript"
    - "nextjs"
  domain_signals:
    - "component"
    - "ui"
    - "ux"
    - "frontend"
    - "spa"
    - "css"
    - "accessibility"
    - "design system"

location:
  preferred_locations:
    - "worldwide"
    - "anywhere"
    - "global"
    - "remote"
    - "work from anywhere"
  excluded_locations:
    - "us only"
    - "usa only"
    - "must be located in the us"
    - "no visa sponsorship"
    - "us citizen"
    - "north america only"
  work_types:
    - remote
    - hybrid
  timezone_compatible:
    - "utc"
    - "gmt"
    - "flexible"
    - "async"
    - "any timezone"
  timezone_incompatible:
    - "pst only"
    - "est only"
    - "us timezone required"

outreach:
  candidate_name: ""
  candidate_core_skills: ["react", "typescript", "nextjs"]
  candidate_extra_skills: ["javascript", "css", "graphql", "vite"]
  linkedin_search_titles:
    - { title: "Engineering Manager", label: "Eng Manager", category: "engineering" }
    - { title: "Frontend Lead", label: "FE Lead", category: "engineering" }
    - { title: "Head of Engineering", label: "Head of Eng", category: "executive" }
    - { title: "CTO", label: "CTO", category: "executive" }
    - { title: "Technical Recruiter", label: "Tech Recruiter", category: "hr" }
    - { title: "Talent Acquisition", label: "TA", category: "hr" }
  bio_short: "building polished {skills} UIs"
  achievements:
    - "Shipped accessible, performant product UI used by real customers."
  dm_short_template: "{greeting}, I noticed {company} is hiring for {title}. I have experience {bio_short}. Would love to connect."
  dm_long_template: |
    {greeting},

    Noticed {company} is hiring for {title}. I've been working with {skills} and thought there might be a fit.

    {achievements}

    Open to a short chat?

    Thanks,
    {candidate_name}
  email_digest_subject_role: "frontend"
  email_greeting: "Your Daily Job Digest"
  recipient_email: ""
  email_hour: 9
  email_minute: 0
  email_timezone: "UTC"
