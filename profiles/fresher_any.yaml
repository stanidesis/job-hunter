name: "Fresher / Entry-Level (Any Stack)"
description: "For new grads and interns — no YOE penalty, rewards junior/trainee signals."
schema_version: 2

search:
  default_terms:
    - "software engineer fresher"
    - "graduate software engineer"
    - "entry level developer"
    - "junior software engineer"
    - "software engineer trainee"
    - "new grad software engineer"
  title_keywords_positive:
    - "software engineer"
    - "software developer"
    - "engineer"
    - "developer"
    - "graduate"
    - "entry level"
    - "entry-level"
    - "junior"
    - "trainee"
    - "intern"
    - "associate"
    - "fresher"
    - "new grad"
    - "campus hire"
  title_keywords_negative:
    - "senior"
    - "sr."
    - "staff"
    - "principal"
    - "lead"
    - "architect"
    - "manager"
    - "director"
    - "head of"
    - "vp"
    - "10+ years"
    - "8+ years"
    - "5+ years"
  relevant_skills:
    - "python"
    - "java"
    - "javascript"
    - "typescript"
    - "c++"
    - "c#"
    - "go"
    - "react"
    - "sql"
    - "git"
    - "linux"
    - "aws"
    - "docker"
  jsearch_default_queries:
    - { query: "junior software engineer", country: "us", date_posted: "3days", remote_jobs_only: false }
    - { query: "entry level software engineer", country: "us", date_posted: "3days", remote_jobs_only: false }
    - { query: "new grad software engineer", country: "us", date_posted: "week", remote_jobs_only: false }
    - { query: "graduate software engineer", country: "gb", date_posted: "week", remote_jobs_only: false }
    - { query: "junior developer remote", country: "us", date_posted: "week", remote_jobs_only: true }

scoring:
  experience_target: "fresher"
  min_relevance_score: 40
  min_score_to_store: 20
  weights: { title: 40, skills: 25, experience: 20, signal: 15 }
  core_skills: []
  domain_signals:
    - "learn"
    - "training"
    - "mentorship"
    - "graduate"
    - "entry level"
    - "internship"

location:
  preferred_locations:
    - "worldwide"
    - "anywhere"
    - "global"
    - "remote"
  excluded_locations: []
  work_types:
    - remote
    - hybrid
    - onsite
  timezone_compatible: []
  timezone_incompatible: []

outreach:
  candidate_name: ""
  candidate_core_skills: []
  candidate_extra_skills: []
  linkedin_search_titles:
    - { title: "Engineering Manager", label: "Eng Manager", category: "engineering" }
    - { title: "Recruiter", label: "Recruiter", category: "hr" }
    - { title: "Talent Acquisition", label: "TA", category: "hr" }
    - { title: "University Recruiter", label: "University", category: "hr" }
  bio_short: "a recent graduate eager to contribute"
  achievements: []
  dm_short_template: "{greeting}, I saw {company} is hiring for {title}. I'm {bio_short} and would love to connect."
  dm_long_template: |
    {greeting},

    Noticed {company} is hiring for {title}. I'm early in my career and excited about this kind of work.

    {achievements}

    Would you be open to a short conversation?

    Thanks,
    {candidate_name}
  email_digest_subject_role: "entry-level"
  email_greeting: "Your Daily Job Digest"
  recipient_email: ""
  email_hour: 9
  email_minute: 0
  email_timezone: "UTC"
