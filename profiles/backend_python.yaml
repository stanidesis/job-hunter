    - "express"
    - "sql"
    - "nosql"
    - "microservices"
    - "rabbitmq"
    - "kafka"
    - "elasticsearch"
  jsearch_default_queries:
    - { query: "python django backend developer", country: "us", date_posted: "3days", remote_jobs_only: false }
    - { query: "python backend engineer", country: "us", date_posted: "3days", remote_jobs_only: false }
    - { query: "django developer", country: "us", date_posted: "week", remote_jobs_only: false }
    - { query: "fastapi developer", country: "us", date_posted: "week", remote_jobs_only: false }
    - { query: "python backend remote", country: "us", date_posted: "week", remote_jobs_only: true }
    - { query: "backend engineer python", country: "gb", date_posted: "week", remote_jobs_only: true }

scoring:
  experience_target: "mid"
  min_relevance_score: 50
  min_score_to_store: 25
  weights: { title: 35, skills: 35, experience: 15, signal: 15 }
  core_skills:
    - "python"
    - "django"
    - "fastapi"
    - "flask"
  domain_signals:
    - "api"
    - "backend"
    - "back-end"
    - "server-side"
    - "microservice"
    - "database"
    - "rest"
    - "graphql"
    - "endpoint"

location:
  preferred_locations:
    - "worldwide"
    - "anywhere"
    - "global"
    - "remote"
    - "work from anywhere"
    - "location independent"
  excluded_locations:
    - "us only"
    - "usa only"
    - "us-only"
    - "united states only"
    - "must be located in the us"
    - "must reside in the us"
    - "us-based"
    - "us based"
    - "no visa sponsorship"
    - "us citizen"
    - "us work authorization"
    - "north america only"
    - "na only"
  work_types:
    - remote
    - hybrid
  timezone_compatible:
    - "utc"
    - "gmt"
    - "flexible"
    - "async"
    - "asynchronous"
    - "any timezone"
    - "all timezones"
  timezone_incompatible:
    - "pst only"
    - "est only"
    - "us timezone required"
    - "us hours required"
    - "core hours pst"
    - "core hours est"

outreach:
  candidate_name: ""
  candidate_core_skills: ["python", "django", "fastapi"]
  candidate_extra_skills: ["postgresql", "redis", "aws", "docker", "microservices"]
  linkedin_search_titles:
    - { title: "Engineering Manager", label: "Eng Manager", category: "engineering" }
    - { title: "Tech Lead", label: "Tech Lead", category: "engineering" }
    - { title: "Head of Engineering", label: "Head of Eng", category: "executive" }
    - { title: "CTO", label: "CTO", category: "executive" }
    - { title: "CEO Founder", label: "CEO / Founder", category: "executive" }
    - { title: "Technical Recruiter", label: "Tech Recruiter", category: "hr" }
    - { title: "Talent Acquisition", label: "TA", category: "hr" }
    - { title: "HR Manager", label: "HR Manager", category: "hr" }
  bio_short: "3+ years building {skills} backends"
  achievements:
    - "Shipped production APIs serving thousands of users."
    - "Improved latency and reliability with caching and service design."
  dm_short_template: "{greeting}, I noticed {company} is hiring for {title}. I have {bio_short}. Would love to connect."
  dm_long_template: |
    {greeting},

    Noticed {company} is hiring for {title}. I've been shipping {skills} backends and thought there might be a fit.

    {achievements}

    Open to a short chat?

    Thanks,
    {candidate_name}
  email_digest_subject_role: "backend"
  email_greeting: "Your Daily Job Digest"
  recipient_email: ""
  email_hour: 9
  email_minute: 0
  email_timezone: "UTC"
