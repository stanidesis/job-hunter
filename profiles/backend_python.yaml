    - "fastapi developer"
    - "backend engineer python"
    - "python developer"
  title_keywords_positive:
    - "backend"
    - "back-end"
    - "back end"
    - "python"
    - "django"
    - "fastapi"
    - "software engineer"
    - "software developer"
    - "full stack"
    - "fullstack"
    - "full-stack"
    - "api developer"
  title_keywords_negative:
    - "frontend"
    - "front-end"
    - "front end"
    - "ios"
    - "android"
    - "mobile"
    - "devops"
    - "data scientist"
    - "machine learning"
    - "ml engineer"
    - "ui/ux"
    - "designer"
    - "qa"
    - "test"
    - "intern"
    - "internship"
    - "trainee"
    - "junior"
  relevant_skills:
    - "python"
    - "django"
    - "fastapi"
    - "flask"
    - "celery"
    - "redis"
    - "postgresql"
    - "postgres"
    - "mysql"
